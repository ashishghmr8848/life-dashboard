# Jenkins Configuration as Code: applied on container start (see
# CASC_JENKINS_CONFIG in the Dockerfile). Values come from env vars set in
# docker-compose.jenkins.yml / .env.jenkins (gitignored) - nothing secret is
# baked into this file itself.
#
# github-creds reuses the local gh CLI token; render-api-key/render-owner-id/
# life-dashboard-jwt-secret come from .env.jenkins once you've pasted a real
# Render API key there. Docker Hub is deliberately left for manual setup
# under Manage Jenkins > Credentials regardless (see README's CI/CD section).
jenkins:
  systemMessage: "Life Dashboard CI"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-creds"
              username: "${GITHUB_USERNAME}"
              password: "${GITHUB_TOKEN}"
              description: "GitHub - clone ashishghmr8848/life-dashboard"
          - string:
              scope: GLOBAL
              id: "render-api-key"
              secret: "${RENDER_API_KEY}"
              description: "Render API key - terraform apply/destroy"
          - string:
              scope: GLOBAL
              id: "render-owner-id"
              secret: "${RENDER_OWNER_ID}"
              description: "Render owner id (tea-.../usr-...) - terraform apply/destroy"
          - string:
              scope: GLOBAL
              id: "life-dashboard-jwt-secret"
              secret: "${LIFE_DASHBOARD_JWT_SECRET}"
              description: "Real JWT_SECRET_KEY for the deployed backend"

jobs:
  - script: >
      pipelineJob('life-dashboard') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/ashishghmr8848/life-dashboard.git')
                  credentials('github-creds')
                }
                branches('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
