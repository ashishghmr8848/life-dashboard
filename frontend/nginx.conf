server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy every backend router prefix straight through to the API
    # container. Keep this list in sync with app/routers/*.py.
    location ~ ^/(auth|admin|transactions|subscriptions|goals|plans|health)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback - client-side routing (react-router) handles the rest.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
